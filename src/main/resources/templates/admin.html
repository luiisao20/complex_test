<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <p>Hola soy el home de admin</p>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y-2 divide-gray-200">
        <thead class="ltr:text-left rtl:text-right">
          <tr class="*:font-medium *:text-gray-900">
            <th class="px-3 py-2 whitespace-nowrap">Nombre</th>
            <th class="px-3 py-2 whitespace-nowrap">Apellido</th>
            <th class="px-3 py-2 whitespace-nowrap">Correo</th>
            <th class="px-3 py-2 whitespace-nowrap">Rol</th>
            <th class="px-3 py-2 whitespace-nowrap">Creado</th>
            <th class="px-3 py-2 whitespace-nowrap">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-200">
          <tr
            th:each="user : ${users}"
            class="*:text-gray-900 *:first:font-medium"
          >
            <td class="px-3 py-2 whitespace-nowrap" th:text="${user.firstName}">
              Nandor the Relentless
            </td>
            <td class="px-3 py-2 whitespace-nowrap" th:text="${user.lastName}">
              04/06/1262
            </td>
            <td class="px-3 py-2 whitespace-nowrap" th:text="${user.email}">
              Vampire Warrior
            </td>
            <td class="px-3 py-2 whitespace-nowrap" th:text="${user.role}">
              $0
            </td>
            <td
              class="px-3 py-2 whitespace-nowrap"
              th:text="${T(com.luiisao20.utils.Helper).formatDate(user.createdAt)}"
            >
              $0
            </td>
            <td class="px-3 py-2 whitespace-nowrap flex flex-row gap-4">
              <form
                class="inline"
                method="post"
                th:action="@{/users/delete/{id}(id=${user.id})}"
              >
                <button
                  type="submit"
                  onclick="
                    return confirm('¿Estás seguro de eliminar el registro?');
                  "
                  class="cursor-pointer hover:underline hover:underline-offset-2 text-red-500"
                >
                  Eliminar
                </button>
              </form>
              <a
              th:href="@{/users/edit/{id}(id=${user.id})}"
                class="cursor-pointer hover:underline hover:underline-offset-2 text-blue-500"
                >Editar</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
